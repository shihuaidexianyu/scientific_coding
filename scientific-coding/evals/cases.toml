  "estimates restart loss",
  "uses the stage artifact boundary as sufficient",
  "declines intra-stage checkpoint complexity",
]

# Observed behaviors that fail this case.
fail_if = [
  "serializes internal Python state",
  "adds resume branches to scientific functions",
]

# Supplementary forbidden source patterns; their absence never proves success.
fail_if_patterns = [
  { path = "stages/**/*.py", pattern = 'checkpoint|pickle\.dump|save_state|resume_from' },
