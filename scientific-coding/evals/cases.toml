setup = "The same minimal CLI is called repeatedly with different independent inputs/configs into one records directory. The grader first makes a successful historical attempt, then launches four invocations concurrently: two successes, malformed TOML, and an after-read failure. It independently recomputes all successful scientific results, checks actual child execution/output, compares historical record/log/result bytes, queries all five attempts twice, and validates per-attempt provenance and lifecycle. A mutable shared aggregate index may grow; immutable prior attempt files must not change. No scheduler is requested."
pass_criteria = ["five real attempted invocations remain separately queryable with unique IDs and correct success/failure/exit status, including both concurrent failure modes", "keeps each attempt's full parent/child stdout/stderr, traceback when failed, actual config/input/code identity, lifecycle and available scoped resources; never replaces a failed attempt with its retry", "preserves historical records, logs and scientific results byte-for-byte while allowing the shared index to add independent attempts safely", "all successful results match independent inclusive-threshold numeric oracles for unequal groups and different configs", "the implementation stays proportional: one execution boundary, independent files or safe index writes, no new scheduler, controller, repeated input checks or human approval gates", "actually verifies concurrent runs and explains Chinese data/record structures and measured resource scope, with executed final comment-format checking", "after code delivery states a Chinese single-run and batch cost estimate with actual workload, CPU/GPU and memory/workers assumptions, correct dominant time/memory scaling and bottleneck; any projected ceil(K/W) times T is explicitly conditional on comparable independent jobs and accounts for startup, contention and tail effects", "separates direct measurements, extrapolations and unsupported absolute estimates; uses matching retained calibration evidence or gives a minimal calibration plan, and never claims W-fold speedup, guessed seconds or guessed peak memory as measured facts"]
fail_if = ["parallel writers overwrite or truncate old attempts or lose index entries", "records only successful experiments or gives failures zero exit codes", "uses directory existence or an empty template as proof the run completed", "does not actually call the protected child or fails to retain its stdout/stderr", "changes scientific results, equality behavior or previous files", "adds a generic scheduler or repeated validation/logging gates inside scientific computation", "claims ideal linear concurrency or unsupported numerical timings as established performance"]

# 纯内存函数聚焦新表达式约束，避免运行记录建设遮住本案例主题。
[[case]]
id = "shallow_named_steps"
task_class = "SIMPLIFY_EXPRESSIONS"
fixture = "dense_contacts"
outcome = "shallow_named_steps"
prompt = "Read README.md and refactor contacts.py under the current scientific-coding expression/readability rules. Keep both public pure-function signatures and all documented numerical, order, empty-value, label-fallback and lazy-consumption semantics. This is an imported in-memory module, not a runnable pipeline: do not add a scientific CLI, run recorder or scheduler. Replace nested comprehensions, inline generation/aggregation in call arguments, complex fallback/conditional chains, and the loop that mixes collection, classification and output construction with shallow named steps. Keep every source/config physical line within 80 Unicode characters, complete truthful Chinese documentation, actually test alternate inputs, and report the affected cost tradeoffs without inventing timing measurements."
prompt_zh = "先读 README.md，按当前 scientific-coding 的表达式和可读性规则重构 contacts.py。保持两个纯函数的公共签名，以及已说明的数值、顺序、空值、标签后备和惰性消费语义。这是被导入的内存模块，不是可运行流水线；不要新建科学 CLI、运行记录器或调度器。把嵌套推导式、调用参数中的内联生成/聚合、复杂 fallback/条件链，以及混合收集、判因和输出构造的循环拆成浅层具名步骤。所有源码/配置物理行最多 80 个 Unicode 字符，完善真实中文说明，实际验证不同输入，报告受影响的成本权衡，不虚构耗时测量。"
setup = "contacts.py exposes build_report(groups, preferred_labels, default_label, minimum_uv) and sum_nonmissing(values), without any file I/O or runnable entry. Inputs are already valid. Enabled contacts retain group/record order, including contacts with no valid samples. accepted_values_uv keeps non-None values at or above the threshold in contact/sample order; zero is valid, negative thresholds are allowed. Reasons are missing/below/retained, peak is the signed maximum or None, and label selects the first nonempty preferred/row/default/contact string using established truthy semantics. sum_nonmissing consumes a one-shot iterator while adding, skips None, and preserves float-subclass addition behavior. The deterministic grader imports only an isolated copy, computes independent alternate-shape/empty/boundary oracles, checks input nonmutation and iterator/addition event order, and mechanically checks explicit AST structures and Unicode line lengths. Semantic loop responsibility is assessed by reading, not by counting statements."
pass_criteria = ["preserves both public signatures, exact returned dictionary/row structures and independent numerical results, including inclusive boundaries, zero/negative values and None", "preserves group/contact/sample ordering, signed maxima, contact membership and the documented truthy empty-string label fallback, without new input mutation or redundant validation", "replaces multi-for, multi-if, nested and conditional comprehensions with shallow explicit or meaningfully named operations, rather than merely wrapping lines or disguising them with map/filter/lambda", "names generated, filtered, mapped or aggregated data and compound constructions before passing them to calls; does not introduce pointless variables for simple constants or fixed options", "expands multi-level fallback, nested ternaries and mixed short-circuit choices into readable if/elif/else while preserving each branch's actual missing-value semantics", "every loop has one describable operation; collection, reason classification and report construction are clear named steps, with no deep loop/if nesting or generic controller/framework", "all created/edited source and config lines, including Chinese documentation and comments, are at most 80 Unicode characters without tabs, and an authoring script actually checks final width/structure/comment spacing after edits", "keeps sum_nonmissing genuinely streaming: consumes the one-shot iterator once, interleaves each addition with input consumption, preserves float-subclass addition and does not silently materialize a list or coerce numeric values", "completes locally understandable Chinese file/function/block explanations against the final code, verifies the actual changed semantics, and states any added-pass/memory/laziness cost honestly without fabricating absolute timings"]
fail_if = ["leaves the original dense logic inside another helper/module, map/filter/lambda or merely wraps its lines", "changes zero into missing, changes inclusive comparison to strict, sorts/deduplicates contacts, takes an absolute instead of signed maximum, or changes empty-string fallback into None-only fallback", "computes correct fixed fixture numbers but fails alternate inputs, mutates caller inputs, renames public keyword parameters or changes return structures", "materializes the streaming iterable, consumes it twice, or changes addition/evaluation order through eager construction or forced float conversion", "counts statements to claim one loop has one responsibility without separating the actual collection/classification/output concerns", "adds a scientific CLI, logging framework, scheduler or repeated input gates to this pure module", "claims final structure, line width, spacing or numerical checks without actually running them, or drops required explanation merely to fit 80 columns"]
