# Remove explanatory comments from selected source and configs to make annotation an actual edit.
[[case]]

# Stable case identifier used by selection and result directories.
id = "semantic_comments_and_data_guide"

# Task category for reporting.
task_class = "IMPROVE_READABILITY"

# Source fixture copied into an isolated repository.
fixture = "minimal_pipeline"

# Controlled source perturbation made before the baseline snapshot.
variant = "unannotated"

# Independent positive checks of actual produced outputs.
outcome = "continuous"

# English task actually sent to the agent.
prompt = "Make this pipeline readable as a scientific explanation: annotate each meaningful operation locally, grouping lines that do one thing, and explain every TOML section and key. Put a blank line before each comment block and keep the comment adjacent to its code. Describe the initial data and every intermediate representation: formats, fields or axes, types, units, IDs, ordering, and how to read/process them. Preserve the method, then run through the final figure."

# Chinese task actually sent with --language zh.
prompt_zh = "把流水线写成我能对照理解的科学说明：每个有意义的操作都在附近注释，可以几行共用一个语义块注释；每个 TOML 小节和键都解释。每个注释块前空一行，注释和代码紧挨。说明最初数据和每阶段中间数据的格式、字段或轴、类型、单位、ID、顺序，以及如何读取和处理。保持方法不变，运行到最终图。"

# Facts and intended boundary of this test, provided to the rubric judge.
setup = "Stage comments and config comments were removed; the detailed README was replaced with one run command. Contracts remain available as evidence."

# All required behavioral criteria; missing evidence remains unknown.
pass_criteria = ["scientific operations have useful nearby explanations at semantic-block granularity", "TOML sections and keys explain meaning, units and conventions", "comment blocks have a preceding blank line except at file start and no blank gap before code", "data guide covers initial and every stage output plus important in-memory conversions", "annotations describe intent and method rather than translating syntax", "method and numerical outputs remain unchanged"]

# Observed behaviors that fail this case.
fail_if = ["adds only a module overview while leaving operations unexplained", "adds noisy one-word line comments or blanket coverage metrics", "changes science just to improve prose"]

# Inject redundant checks into one internal stage; necessary boundary checks stay in the fixture.
[[case]]

# Stable case identifier used by selection and result directories.
id = "remove_redundant_checks"

# Task category for reporting.
task_class = "IMPROVE_READABILITY"

# Source fixture copied into an isolated repository.
fixture = "minimal_pipeline"

# Controlled source perturbation made before the baseline snapshot.
variant = "redundant_checks"

# Independent positive checks of actual produced outputs.
outcome = "continuous"

# Independently exercise valid external reuse, tamper rejection and internal trust.
probe_boundaries = true

# English task actually sent to the agent.
prompt = "The preprocessing stage repeats checks of IDs, finite numeric amplitudes, and group labels already guaranteed by acquisition or external entry. Remove unnecessary internal rechecking and gating throughout this pipeline, while keeping checks for new external inputs and requirements newly threatened by filtering. Keep the code locally understandable, avoid adding a validation framework, and run through the final figure."

# Chinese task actually sent with --language zh.
prompt_zh = "预处理重复检查了已由采集或外部入口保证的 ID、有限数值振幅和分组标签。删除流水线中这些不必要的内部重复检查和门控，保留外部输入校验，以及过滤后才可能被破坏的要求。保持局部可读，不新增校验框架，并运行到最终图。"

# Facts and intended boundary of this test, provided to the rubric judge.
setup = "A few redundant guards were injected before preprocessing; after filtering each condition still needs at least two rows. External artifact integrity and schema remain necessary."

# All required behavioral criteria; missing evidence remains unknown.
pass_criteria = ["removes injected ID, numeric and label rechecks from trusted internal preprocessing", "retains one external artifact validation entry", "retains post-filter group-size validation because filtering introduces that risk", "does not replace guards with validation flags, registries or managers", "preserves the scientific result and completes the figure"]

# Observed behaviors that fail this case.
fail_if = ["deletes necessary external checks", "repeats verification between in-process stages", "adds new wrappers or bookkeeping solely to track validation state"]

