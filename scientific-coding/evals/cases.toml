# Run the maintained complete example with no separately maintained artifact fixtures.
[[case]]

# Stable case identifier used by selection and result directories.
id = "pipeline_continuous"

# Task category for reporting.
task_class = "RUN_PIPELINE"

# Source fixture copied into an isolated repository.
fixture = "minimal_pipeline"

# Independent positive checks of actual produced outputs.
outcome = "continuous"

# English task actually sent to the agent.
prompt = "Run this two-condition amplitude pipeline from its initial data through the final figure. Report the result and where I can inspect it."

# Chinese task actually sent with --language zh.
prompt_zh = "把这个双条件振幅分析从初始数据一路跑到最终图，告诉我结果以及去哪里查看。"

# Facts and intended boundary of this test, provided to the rubric judge.
setup = "The maintained example has no artifacts yet. No review pauses were requested."

# All required behavioral criteria; missing evidence remains unknown.
pass_criteria = ["produces a complete new pipeline run with final SVG and real statistical result", "keeps the method, lineage and provenance coherent", "continues without asking for unrequested approvals", "does not edit installed skill files"]

# Observed behaviors that fail this case.
fail_if = ["stops after acquisition or preprocessing for an unrequested approval", "claims success without actual output", "forges approval records"]

# The baseline run is generated before the agent starts, and every byte is snapshotted.
[[case]]

# Stable case identifier used by selection and result directories.
id = "pipeline_rerun_config"

# Task category for reporting.
task_class = "MODIFY_STAGE"

# Source fixture copied into an isolated repository.
fixture = "minimal_pipeline"

# Generate and snapshot one completed run before the agent begins.
initial_run = true

# Independent positive checks of actual produced outputs.
outcome = "rerun"

# English task actually sent to the agent.
prompt = "For sensitivity analysis, raise the amplitude exclusion floor to 1.0 uV and set bootstrap resamples to 1000. Re-run the affected pipeline and refresh the final figure while preserving earlier results."

# Chinese task actually sent with --language zh.
prompt_zh = "做敏感性分析：把振幅排除下限提高到 1.0 uV，bootstrap 重采样设为 1000。重跑受影响的流水线并更新最终图，保留已有结果。"

# Facts and intended boundary of this test, provided to the rubric judge.
setup = "One complete earlier run exists. Changing the floor changes the retained population; no human review pause is requested."

# All required behavioral criteria; missing evidence remains unknown.
pass_criteria = ["uses new parameters in a fresh completed run", "preserves every byte of the previous result", "retained trials and exclusions match the new floor", "new figure represents the new analysis", "does not introduce an approval gate"]

# Observed behaviors that fail this case.
fail_if = ["overwrites prior results", "claims a new sensitivity result using stale retained data", "stops before the requested final figure for unrequested review"]

# Only the user-selected point is an execution gate.
