probe_boundaries = true

# English task actually sent to the agent.
prompt = "Audit whether this pipeline validates external artifacts once at entry while trusting internal data already established by the same run. Make only necessary fixes, explain where each retained check belongs, and run the pipeline through the final figure. Demonstrate that a valid external artifact can be reused and tampered bytes are rejected."

# Chinese task actually sent with --language zh.
prompt_zh = "检查这个流水线是否只在外部 artifact 入口校验一次，并信任同一流程已经保证的内部数据。仅做必要修改，解释保留校验各自属于哪里，运行到最终图，并演示有效外部结果可以复用、被改动的字节会被拒绝。"

# Facts and intended boundary of this test, provided to the rubric judge.
setup = "The maintained example supports externally supplied raw or processed artifacts as explicit pipeline config inputs."

# All required behavioral criteria; missing evidence remains unknown.
pass_criteria = ["accepts an intact externally persisted result", "rejects modified tracked bytes at the external entry", "does not duplicate that validation inside in-process stages", "explains why post-filter population checks differ from unchanged ID/type checks", "runs through the final figure"]

# Observed behaviors that fail this case.
fail_if = ["turns validation off globally to remove duplicates", "only checks status labels rather than actual bound bytes", "requires review without a user-selected pause"]

# A new study generated from two supplied data sources; the prompt gives scientific goals only.
[[case]]

# Stable identifier for the neutral from-scratch generation test.
id = "create_readable_pipeline"

# The agent must implement and execute a new small study.
task_class = "CREATE_PIPELINE"

# Two CSVs are the complete initial fixture; no existing code or explanatory README.
fixture = "readable_inputs"

# Exact independent numeric and excluded-identity checks for these twelve observations.
outcome = "created_pipeline"

# Specify the scientific task and output interface without restating the skill's style rules.
prompt = "Implement and run a reproducible analysis using only the Python standard library. raw.csv has trial_id and amplitude_uv (microvolts); conditions.csv assigns each trial_id to control or treatment. Join the two tables one-to-one by trial_id, exclude amplitudes strictly below 0.5 uV, then compute each group's retained count and mean and the treatment-minus-control mean difference. Write results/summary.json with counts={control: integer, treatment: integer}, means_uv={control: number, treatment: number}, and difference_uv=number. Write results/exclusions.csv with trial_id, condition, amplitude_uv and reason for excluded trials, and results/results.svg comparing the two retained means. Explain how to run the analysis and where to inspect its result."

# Chinese equivalent for the language dimension, with the same scientific/output constraints.
prompt_zh = "请只用 Python 标准库实现并运行一个可复现分析。raw.csv 包含 trial_id 和 amplitude_uv（微伏），conditions.csv 按 trial_id 指定 control 或 treatment。按 trial_id 一对一连接，排除振幅严格小于 0.5 uV 的试次，计算每组保留数量、平均振幅以及 treatment 减 control 的均值差。输出 results/summary.json，字段为 counts={control:整数,treatment:整数}、means_uv={control:数值,treatment:数值}、difference_uv=数值；输出 results/exclusions.csv，记录被排除的 trial_id、condition、amplitude_uv 和 reason；输出 results/results.svg 比较保留后的两组均值。说明如何运行分析以及去哪里查看结果。"

# The condition rows intentionally differ in order from raw rows; one control trial is excluded.
setup = "Only raw.csv and conditions.csv exist. There are twelve observations, six per condition; control-001 at 0.2 uV is the sole trial below 0.5. Labels are in a different order, so positional zip is incorrect. No review pause is requested."

# The neutral task tests the skill's default code, configuration, data and control-flow behavior.
pass_criteria = ["implements and actually runs the requested standard-library analysis with correct outputs", "joins both inputs by trial_id with explicit one-to-one semantics", "locally explains meaningful scientific operations in semantic blocks, with a blank line before each comment block and no gap before its code", "explains every TOML section/key if TOML is created", "documents both initial sources, joined data, retained/excluded trials and summary with formats, fields, units, identity and how to read them", "checks new external input requirements once and trusts established internal guarantees", "continues through the final SVG without an unrequested approval gate", "keeps the implementation proportional to this small study"]

# Failures concern observed implementation and behavior, not the absence of a prescribed framework.
fail_if = ["produces only a plan or stops before the requested outputs", "joins labels positionally rather than by identity", "repeats unchanged ID/type/label checks in multiple internal steps", "creates a validation manager or generic processing framework for this small task", "adds approval requirements without a user-selected pause", "leaves scientific operations or data transitions unexplained"]

# Isolate the new automated spacing requirement without changing earlier case rubrics.
[[case]]

# Identifier for a bounded three-language formatting task.
id = "automated_comment_spacing"

# The scientific method remains fixed while authoring-time layout is improved.
task_class = "IMPROVE_READABILITY"

# Three small source/config files contain comments and hash characters inside strings.
fixture = "comment_spacing"

# Independently compare Python AST, TOML values and shell program text, then inspect output.
outcome = "comment_spacing"

# Ask for the visible result without telling the agent to create a formatting script.
prompt = "Organize the comment layout in analysis.py, parameters.toml and run.sh so each comment block has a blank line before it and stays adjacent to the code it explains. Preserve the scientific calculation, every existing string and the runnable shell entry point. Run the example after the edit and verify that the result is unchanged."

# The Chinese version requests the same layout and behavior, without naming a script mechanism.
prompt_zh = "整理 analysis.py、parameters.toml 和 run.sh 的注释排版：每个注释块前空一行，并紧挨它解释的代码。保持科学计算、所有已有字符串和可运行的 shell 入口不变。修改后运行示例，验证结果没有改变。"

# Hash-prefixed lines inside multi-line strings and the shebang are deliberately meaningful.
setup = "The fixture contains Python, TOML and Bash, with missing blank lines before real comments. Python and shell include multi-line strings with hash-prefixed literal lines; TOML includes a quoted hash. Expected result: label sensor #1, retained count 2 and mean 1.0 uV."

# Require observed execution of the new skill behavior only in this dedicated case.
pass_criteria = ["writes and actually executes a small task-specific formatting script; mentioning or promising a script is insufficient", "the script covers all three edited languages: Python, TOML and Bash", "uses language-aware handling so strings and the shell shebang are preserved", "runs the formatting script after the last source change and checks that no comment-spacing omissions remain", "checks syntax or parsing for each edited language, including bash -n or an equivalent shell parser", "preserves the scientific calculation and all strings and actually runs the example successfully", "keeps formatting as an authoring-time operation, without adding a pipeline runtime formatting gate or a general framework"]

# These failures are specific to automated authoring-time formatting, not the earlier cases.
fail_if = ["makes only manual spacing edits without writing and executing the task-specific script", "handles Python and TOML but overlooks Bash", "treats hash-prefixed lines inside strings as comments and changes their contents", "moves the shebang away from the first line", "claims a clean formatting check without executing it", "changes the scientific method or adds formatting checks to normal analysis execution"]

# 小型现有分析用于测试新版默认中文、hover 文档和数据结构说明。
[[case]]

# 本案例的稳定名称。
id = "chinese_hover_contracts"

# 只改进解释和可读性，不改变既有科学方法。
task_class = "IMPROVE_READABILITY"

# 包含两张 CSV、四个科学函数、一个 TOML 和边界回归测试。
fixture = "scientific_review"

# 数值、真实 docstring、逐参数标识和注释空行的独立核验。
outcome = "chinese_review"

# 提示词只说明使用者的阅读需求，具体规范由 skill 给出。
prompt = "Make this small amplitude analysis understandable to a Chinese-speaking researcher reading the code and hovering over function calls. Keep the public function signatures and the inclusive >= 0.5 uV scientific rule unchanged. Explain how its two CSV inputs become the outputs, run the analysis and its tests, and deliver the finished files."

# 中文任务与英文保持同一科学约束。
prompt_zh = "让这个小型振幅分析便于中文科研使用者阅读代码和悬停函数调用来理解。保持公共函数签名以及振幅 >= 0.5 uV 的科学规则不变。讲清楚两张 CSV 如何变成输出，运行分析和已有测试，交付完成的文件。"

# 现有文件的英文说明刻意不完整，不能作为已达标模板。
setup = "Existing source has short English module/function docstrings, undocumented dict structures and English TOML comments. The two sources are joined by ID. The inclusive rule retains 5 control and 6 treatment trials."

# 检查真正 IDE 文档和具体内容，不能以普通函数前注释代替。
pass_criteria = ["provides real Chinese module and function docstrings accessible through editor hover", "each function documents its purpose, every parameter's concrete structure, ordered logic, each return product and side effects in separated paragraphs", "file overview names real input/output paths, reading methods, processing order and associated TOML fields", "TOML and scientific operation explanations are Chinese and truthful", "data descriptions cover raw rows, joined rows, retained/excluded rows and summary structures", "preserves the scientific values and actually executes the analysis and tests", "runs the task-specific formatter and a final clean check after source edits"]

# 未提供实质文档或误改方法都属于失败。
fail_if = ["uses only ordinary comments above functions instead of actual docstrings", "uses English prose or one-line packed parameter descriptions", "invented data shapes or effects contradict the code", "changes the public signatures or inclusive filtering rule", "claims tests passed without running them"]

# 同一小项目独立测试分轮审查与冗余检查删除。
[[case]]

# 稳定案例名称。
id = "review_rounds_simplify"

# 本案例要求审查并完成必要修改。
task_class = "AUDIT_STAGE"

# 与文档案例使用相同源数据和方法。
fixture = "scientific_review"

# 最终数值和接口仍按包含等号的原规则检查。
outcome = "rounds_review"

# 不直接规定每轮步骤，检查 skill 是否使 agent 自行采用适当顺序。
prompt = "Review this study implementation and make it clearer. It repeats ID, numeric and label validation in filter_trials and summarize even though load_trials already establishes these facts. Simplify the unnecessary checks while retaining external input validation and the post-filter empty-group requirement. Keep the public APIs and scientific rule unchanged, update the explanations and deliver a tested result."

# 中文任务说明已知问题，但不把分轮流程写进用户提示。
prompt_zh = "审查这个研究实现并让它更清楚。filter_trials 和 summarize 重复检查了 load_trials 已保证的 ID、数值和标签。删除不必要检查，保留外部输入校验和过滤后空分组要求。保持公共接口和科学规则不变，更新说明并交付经过验证的结果。"

# 重复检查在内部，空分组风险则由过滤重新引入。
setup = "Three functions repeat identical row checks. Only load_trials owns external CSV validity, while summarize must still detect a condition emptied by filtering. Expected result remains the original >= 0.5 uV study."

# 轮次必须从真实操作顺序判断，而非 agent 自述标题。
pass_criteria = ["first establishes the current method and boundary behavior before changing it", "removes unchanged ID/type/label rechecks from the internal filter and summary", "retains external source checks and the new post-filter empty-group requirement", "completes explanatory documentation after settling the implementation", "writes and executes the task-specific formatter, obtains a clean check after the last source edit, and verifies final science and tests; a clean final --check is sufficient without a no-op fix pass", "keeps rounds as the agent's own work sequence without adding runtime gates, managers or user approval steps", "preserves inclusive-boundary outputs and public function signatures"]

# 用新框架取代重复校验同样失败。
fail_if = ["deletes external checks or the empty-group guard", "moves duplicate guards into a new validation manager", "formats before later edits and claims that old formatting check remains current", "changes the scientific rule", "requires user approval between self-directed review rounds"]

# 真正的后续用户轮次：第一个 CLI 会话完成后注入人工文件，再 resume 同一 session。
[[case]]

# 独立多轮案例名称。
id = "mid_review_user_change"

# 先审查已有科学行为，随后接受用户新增科学修改。
task_class = "MULTITURN_REVIEW"

# 第一轮使用同一可运行小型研究。
fixture = "scientific_review"

# 第二轮严格边界、人工代码哈希和第一轮结果分别核验。
outcome = "resumed_review"

# 第一轮请求完成原规则的审查和测试，没有预告后续改变。
prompt = "Review this small study, simplify redundant internal checks and improve the Chinese explanation while preserving its public function signatures and current amplitude >= 0.5 uV rule. Run the analysis and regression tests, then report the finished review and its output."

# 第一轮中文消息不包含第二轮要求。
prompt_zh = "审查这个小研究，简化内部冗余检查并完善中文说明，保持公共函数签名和当前振幅 >= 0.5 uV 规则不变。运行分析和回归测试，然后报告本轮完成的审查和输出。"

# 这条消息仅在第一轮模型完成、独立检查和人工代码注入后通过 --resume 发送。
followup_prompt = "I have now added manual_note.py with annotate_summary; preserve that human-written file byte-for-byte and include its user_note in the saved summary. I also manually changed the comparisons inside analysis.py to make the filtering rule strictly > 0.5 uV. Read the current edited code: values equal to 0.5 must now be excluded, and my changed scientific behavior must be preserved. Keep the prior results in results_before_user_change untouched. Continue the review against this new requirement: update the implementation, Chinese documentation, TOML explanations and the relevant boundary tests, run the updated analysis and checks, and report what was actually revalidated. Public function signatures remain unchanged."

# 实际续接的中文用户消息。
followup_prompt_zh = "我刚加入了 manual_note.py 的 annotate_summary，请逐字保留这个人工文件，并把它提供的 user_note 写进结果摘要。我还手动改了 analysis.py 内的比较式，使筛选规则成为严格 > 0.5 uV。请先读取当前已修改代码：等于 0.5 的试次现在也排除，保留我修改后的科学行为。不要改动 results_before_user_change 中保存的上轮结果。按这个新要求继续审查：更新实现、中文说明、TOML 解释和相关边界测试，重新运行分析与检查，报告这次实际重新验证了什么。公共函数签名保持不变。"

# 这是两次真实会话调用；它不模拟正在执行的单次进程里的实时抢占。
setup = "The harness records a real first CLI turn, independently checks its inclusive result and tests, saves prior outputs, then injects a human-owned module and an AST-located comparison edit into the already reviewed analysis.py before sending a second user message via --resume with the same session ID. This tests a resumed review conversation, not a simulated single prompt or process-time interruption. The strict rule leaves 4 control and 5 treatment trials, means 1.3 and 1.5 uV, difference 0.2 uV."

# 最新要求必须使旧轮次结论失效并触发受影响内容的重新验证。
pass_criteria = ["both user messages occur in the same real CLI session with the second sent after first-round checks and human-code injection", "completes the original inclusive-boundary result and passing tests in round one", "recognizes the later user request as a scientific change and revisits the affected implementation and explanations", "implements strict > 0.5 behavior including equality exclusions", "preserves the exact human-owned file and previous results while adding user_note to the new summary", "updates the boundary regression test and actually runs the updated tests and analysis", "reruns the task-specific formatter in check mode and obtains a clean result after the final second-round source edit, alongside relevant scientific checks; no no-op fix pass is required and earlier passes alone are insufficient", "reports which scientific values changed and which validations were actually rerun"]

# 对旧结果或旧检查的错误沿用是本案例的核心失败。
fail_if = ["treats the follow-up as permission to overwrite the human file", "keeps the old equality behavior or stale docs/tests", "claims the second-round result is validated only because the first-round tests passed", "overwrites the preserved previous results", "performs only one static-prompt task rather than a real resumed user turn"]
