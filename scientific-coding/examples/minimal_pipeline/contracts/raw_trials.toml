# 试次表的科学身份。
name = "RawTrials"

# 解释约定的版本号，与每次运行编号相互独立。
version = 1

# 每行代表一个独立生成的合成试次。
description = "按固定种子进行高斯混合抽样，不移除试次。"

# 数据位置与结构；文件路径相对本产物目录。
[data]

# UTF-8 CSV 含一行表头，不额外保存数据框索引。
path = "data/raw_trials.csv"

# 示例加载器采用的文件格式。
format = "csv"

# 数值仍是试次振幅，不是功率、标准分数或被试平均值。
representation = "trial_amplitudes"

# 行数可变，每行包含所声明的三个字段。
dimensions = ["trial", "field"]

# CSV 文本按下方字段类型进行转换。
dtype = "mixed_record"

# amplitude_uv 使用微伏，ID 与条件标签无量纲。
unit = "amplitude_uv 使用微伏"

# 禁止空字段和非有限振幅。
missing_value = "not_allowed"

# CSV 表的字段类型。
[data.columns]

# 带条件前缀的稳定试次 ID，例如 control-001。
trial_id = "string"

# 实验条件为 control 或 treatment。
condition = "string"

# 有限数值表示的试次振幅，单位为微伏。
amplitude_uv = "float64"

# 样本身份、分组与输出顺序。
[sample]

# 此合成设计中的独立观测与抽样单位。
identity = "独立合成试次"

# 整个流水线实际使用的 CSV 身份字段。
id_column = "trial_id"

# 每个生成试次恰好一行，不允许重复 ID。
unique_ids = true

# 沿用生成顺序：先 control 后 treatment，各组内部编号递增。
ordering = "包含全部生成 ID，先 control 后 treatment，各组内部编号递增"

# 下游试次层面推断所描述的总体。
population = "独立合成试次，默认配置下每组 40 个"

# 各条件分别构成重采样分层。
group_column = "condition"

# 必须同时存在两种声明的条件，其他标签不属于本契约。
group_values = ["control", "treatment"]

# 每组至少两个试次，以支持本示例的下游计算。
min_group_count = 2

# 读取说明与后续使用方式。
[reading]

# 采用标准库 CSV 读取器，artifact_dir 应指向确切的本次产物。
example = "list(csv.DictReader((artifact_dir / 'data/raw_trials.csv').open(newline='', encoding='utf-8')))"

# 外部加载时将 amplitude_uv 转为 float 一次；同次生成的内存行已是数值。
in_memory = "行字典列表；trial_id、condition 为字符串，amplitude_uv 为微伏 float；保持样本顺序"

# 相对前一阶段或采集来源发生的变换。
stage_change = "按固定种子进行高斯混合抽样，不移除试次。"
