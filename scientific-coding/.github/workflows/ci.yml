name: scientific-coding-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Unit tests (linter + artifact lifecycle)
        run: python -m unittest discover -s scientific-coding/tests -v

      - name: Linter self-check on the skill repo
        run: python scientific-coding/scripts/scientific_code_lint.py .

      - name: Mock-backend evals (zero tokens, smoke only)
        run: python scientific-coding/evals/run_evals.py --backend mock

      - name: Committed example stays lint-clean (full artifact checks)
        run: python scientific-coding/scripts/scientific_code_lint.py scientific-coding/examples/minimal_pipeline --full-artifact-checks
