# 单次实验的统一参数模板，使用时按实验目的重命名为 amplitude_comparison.toml。
# 与实验 MD、专属编排 Python 放在 experiments/amplitude_comparison/ 中。
# 相对路径均以这份 TOML 所在目录为基准，编排器读取、解析并分发参数。
# 阶段顺序和方法分支写在编排代码中，不在此指定脚本或其他配置文件。

# 实验标识，用于关联设计说明、运行记录和结果。
[experiment]

# 名称不作为动态选择科学实现的开关。
name = "amplitude_comparison"

# 实际输入位置及科学角色。
[input]

# UTF-8 试次表，含 trial_id、condition、amplitude_uv 列。
trials_path = "../../data/trials.csv"

# 输出位置；每次尝试由编排器在此目录下创建新编号。
[output]

# 科学结果的父目录，不覆盖已有运行。
run_root = "../../runs/amplitude_comparison"

# 日志与尝试记录的父目录，保存成功和失败运行。
execution_root = "../../executions/amplitude_comparison"

# 筛选步骤的科学参数，具体依据写在实验 MD 中。
[preprocess]

# 振幅下限，单位微伏；严格小于时排除，等于时保留。
amplitude_floor_uv = 0.2

# 组内 bootstrap 参数，由编排明确传入估计函数。
[analysis]

# 重采样重复次数 B，不是独立样本量。
n_bootstrap = 2000

# 中心区间概率；示意取值不代表对具体研究的统计建议。
confidence_level = 0.95

# 局部随机数种子，运行记录保留实际使用值。
seed = 20260907

# 运行资源参数，不改变科学方法。
[runtime]

# worker 数量；并行时保持声明的随机与汇总顺序。
workers = 1
